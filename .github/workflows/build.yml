name: Build and Push Caddy L4 Image

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vagt-dev/caddy-l4

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Built for the runner's platform and loaded, so the regression tests run
      # against the same Dockerfile and cache the published build comes from.
      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: caddy-l4:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Regression tests
        run: sh test/run.sh caddy-l4:test

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image tag is <caddy version>-<build revision>. The revision makes a
      # plugin-only change a distinct tag, so consumers pinning an existing tag
      # never have their binary swapped underneath them.
      - name: Derive image tag
        id: version
        run: |
          VERSION=$(grep '^FROM caddy:' Dockerfile | head -1 | sed 's/FROM caddy:\([^-]*\).*/\1/')
          REVISION=$(tr -d '[:space:]' < BUILD_REVISION)
          echo "image_tag=$VERSION-$REVISION" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.image_tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
